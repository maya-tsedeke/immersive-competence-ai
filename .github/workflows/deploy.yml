# Build static site (output: "out") and deploy to GitHub Pages.
# Prerequisites: Settings → Pages → Source = GitHub Actions.
#
# Optional: Repository → Settings → Secrets and variables → Actions → Variables
#   NEXT_PUBLIC_BASE_PATH = /my-repo   (leading slash, no trailing slash)
# If unset, defaults to /REPOSITORY_NAME for https://USER.github.io/REPO/

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        env:
          NEXT_STATIC_EXPORT: "1"
          REPO_DEFAULT_BASE: ${{ format('/{0}', github.event.repository.name) }}
          NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH }}
        run: |
          export NEXT_PUBLIC_BASE_PATH="${NEXT_PUBLIC_BASE_PATH:-$REPO_DEFAULT_BASE}"
          echo "NEXT_PUBLIC_BASE_PATH=$NEXT_PUBLIC_BASE_PATH"
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
